<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>New User</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>

  <body class="bg-light">
    <div class="container-fluid">
      <div class="row min-vh-100 mt-1">
        <!-- Sidebar -->
        <div class="col-12 col-md-2 bg-primary-subtle min-vh-100 p-3 shadow-sm">
          <div class="d-flex flex-column gap-2">
            <a
              href="index.html"
              class="sidebar-link text-dark text-decoration-none px-3 py-3 rounded-3 fw-semibold"
            >
              All Record
            </a>

            <a
              href="add_new.html"
              class="sidebar-link text-dark text-decoration-none px-3 py-3 rounded-3 fw-semibold"
            >
              New Record
            </a>
          </div>
        </div>

        <div class="col-12 col-md-10 p-2 p-md-3 p-lg-4">
          <h1 class="mb-4">New Record</h1>
          <div class="bg-white rounded-3 shadow-sm p-3 p-md-4">
            <form id="userForm">
              <div class="mb-3">
                <label for="name" class="form-label fw-semibold"> Name </label>

                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  placeholder="Enter user name"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">
                  Email
                </label>

                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  placeholder="Enter email"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="password" class="form-label fw-semibold">
                  Password
                </label>

                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="Enter password"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="phone" class="form-label fw-semibold">
                  Phone
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="phone"
                  name="phone"
                  placeholder="Enter phone number"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="address" class="form-label fw-semibold">
                  Address
                </label>

                <textarea
                  class="form-control"
                  id="address"
                  name="address"
                  rows="3"
                  placeholder="Enter address"
                  required
                ></textarea>
              </div>

              <button type="submit" class="btn btn-primary px-4">
                Add User
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="./assets/js/scripts.js"></script>
  </body>
</html>
